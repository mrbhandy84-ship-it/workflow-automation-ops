orchestrator:
  name: "${ENV_VAR}"
  environment: "${ENV_VAR}"
  region: "${ENV_VAR}"

  executor:
    concurrency:
      default_workers: REDACTED
      max_workers: REDACTED
      per_job_type_limits:
        ingestion: REDACTED
        notification: REDACTED
        export: REDACTED
        enrichment: REDACTED
    timeout_defaults:
      job_timeout_seconds: REDACTED
      workflow_timeout_seconds: REDACTED
    heartbeat_interval_seconds: REDACTED

  queue:
    backend: "${ENV_VAR}"
    connection_string: "${ENV_VAR}"
    default_queue: "${ENV_VAR}"
    priority_queues:
      - name: "${ENV_VAR}"
        weight: REDACTED
      - name: "${ENV_VAR}"
        weight: REDACTED
      - name: "${ENV_VAR}"
        weight: REDACTED
    dead_letter_queue: "${ENV_VAR}"
    visibility_timeout_seconds: REDACTED

  state_store:
    backend: "${ENV_VAR}"
    connection_string: "${ENV_VAR}"
    schema: "${ENV_VAR}"
    lock_ttl_seconds: REDACTED
    checkpoint_interval: REDACTED

  event_bus:
    backend: "${ENV_VAR}"
    connection_string: "${ENV_VAR}"
    default_topic: "${ENV_VAR}"
    consumer_group: "${ENV_VAR}"
    publish_retries: REDACTED

  observability:
    tracing:
      enabled: REDACTED
      exporter: "${ENV_VAR}"
      endpoint: "${ENV_VAR}"
      sample_rate: REDACTED
    metrics:
      enabled: REDACTED
      exporter: "${ENV_VAR}"
      push_interval_seconds: REDACTED
    logging:
      level: "${ENV_VAR}"
      format: REDACTED
      include_correlation_id: REDACTED

  security:
    tenant_isolation: REDACTED
    payload_encryption: "${ENV_VAR}"
    encryption_key_ref: "${ENV_VAR}"
    audit_log_enabled: REDACTED
